<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Bản đồ tương tác — Final Fantasy IX</title>
<style>
:root{
  --bg:#0e1116; --panel:#151a22; --panel2:#1b212b; --line:#252d3a;
  --ink:#e8edf5; --muted:#8b97ab; --accent:#5aa9e6; --ok:#4ade80;
  --shadow:0 8px 28px rgba(0,0,0,.45);
  --side:300px;
}
:root[data-theme="light"]{
  --bg:#eef1f6; --panel:#ffffff; --panel2:#f4f6fa; --line:#dde3ec;
  --ink:#121722; --muted:#5e6a7d; --accent:#1d6fb8;
  --shadow:0 8px 28px rgba(15,23,42,.12);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink); overflow:hidden;
  font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-tap-highlight-color:transparent;
}
button,input,select{font:inherit; color:inherit}
button{cursor:pointer}

#app{display:flex; height:100%}

/* ---------- sidebar ---------- */
#side{
  width:var(--side); flex:0 0 var(--side); background:var(--panel);
  border-right:1px solid var(--line); display:flex; flex-direction:column;
  transition:margin-left .22s ease;
  overflow-y:auto; overscroll-behavior:contain;   /* để nút dưới đáy luôn tới được */
}
#side.closed{margin-left:calc(var(--side) * -1)}
.sec{padding:12px 14px; border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.brand{display:flex; align-items:center; gap:9px}
.brand .dot{width:9px; height:9px; border-radius:50%; background:var(--accent); flex:0 0 auto}
.brand h1{margin:0; font-size:14px; font-weight:650; letter-spacing:-.01em}
.brand small{display:block; color:var(--muted); font-size:11.5px; font-weight:400}

label.fld{display:block; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:5px}
select,input[type=text],input[type=search],textarea{
  width:100%; background:var(--panel2); border:1px solid var(--line);
  border-radius:8px; padding:8px 10px; outline:0;
}
select:focus,input:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical; min-height:62px}

#catlist{flex:0 0 auto; padding:6px 8px}
.cat{
  display:flex; align-items:center; gap:9px; width:100%;
  background:transparent; border:0; border-radius:8px;
  padding:7px 8px; text-align:left;
}
.cat:hover{background:var(--panel2)}
.cat .sw{width:20px; height:20px; border-radius:6px; flex:0 0 auto; display:grid; place-content:center;
  color:#0b1016; border:1.5px solid rgba(255,255,255,.2)}
.cat .sw svg{width:13px; height:13px; display:block}
.cat.off .sw svg{opacity:.5}
.cat .nm{flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.cat .ct{color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums}
.cat.off{opacity:.38}
.cat.off .sw{background:transparent !important}

.bar{height:6px; border-radius:99px; background:var(--panel2); overflow:hidden; margin-top:7px}
.bar i{display:block; height:100%; background:var(--ok); width:0; transition:width .25s}
.pstat{display:flex; justify-content:space-between; font-size:12px; color:var(--muted)}

.row{display:flex; gap:7px; flex-wrap:wrap}
.btn{
  background:var(--panel2); border:1px solid var(--line); border-radius:8px;
  padding:7px 11px; font-size:13px; flex:1 1 auto;
}
.btn:hover{border-color:var(--accent)}
.btn.on{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600}
.btn.danger:hover{border-color:#ef4444; color:#ef4444}

/* ---------- map ---------- */
#stage{position:relative; flex:1 1 auto; overflow:hidden; background:var(--bg)}
#viewport{position:absolute; inset:0; cursor:grab; touch-action:none; overflow:hidden}
#viewport.drag{cursor:grabbing}
#viewport.edit{cursor:crosshair}
#world{position:absolute; top:0; left:0; transform-origin:0 0; will-change:transform}
#world{user-select:none; -webkit-user-select:none}
#world img{display:block; max-width:none; pointer-events:none;
  user-select:none; -webkit-user-drag:none; -khtml-user-drag:none}
#links{position:absolute; top:0; left:0; overflow:visible; pointer-events:none}
#links line{vector-effect:non-scaling-stroke; stroke-linecap:round}
#links line.edge{stroke-width:2.5; opacity:.55; pointer-events:stroke; cursor:pointer}
#links line.edge:hover{opacity:1; stroke-width:5}
#links line.route{stroke-width:5; opacity:.95; stroke-dasharray:none; filter:drop-shadow(0 0 4px rgba(0,0,0,.6))}
#links.hidden line.edge{display:none}
.pin.rstart{outline:3px solid #4ade80; outline-offset:2px; z-index:7}
.pin.rend{outline:3px solid #ef4444; outline-offset:2px; z-index:7}
.pin.linksel{outline:3px dashed #fbbf24; outline-offset:2px; z-index:7}
.steps{margin:0; padding-left:17px; display:grid; gap:4px}
.steps li{color:var(--muted)}
.steps li b{color:var(--ink); font-weight:600}
.pill{display:inline-block; padding:1px 7px; border-radius:99px; font-size:11px; color:#0b0f14; font-weight:700}
.clu{display:flex; align-items:center; gap:7px; padding:3px 0; font-size:12.5px}
.clu .sw{width:11px; height:11px; border-radius:3px; flex:0 0 auto}
.clu .nm{flex:1 1 auto; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.clu .ct{color:var(--muted); font-variant-numeric:tabular-nums}
#fallback{
  /* pointer-events:none để phần nền KHÔNG nuốt chuột — README hứa là chưa
     có ảnh vẫn đặt và kéo marker bình thường, mà trước đây lớp phủ này
     chặn sạch. Riêng hộp chữ ở giữa thì nhận chuột lại (xem bên dưới). */
  pointer-events:none;
  position:absolute; inset:0; display:none; place-content:center; text-align:center;
  background:
    linear-gradient(135deg,#1b3b57,#14293c),
    repeating-linear-gradient(0deg,transparent 0 79px,rgba(255,255,255,.05) 79px 80px);
  color:#cfe3f5; padding:40px;
}
#fallback > div{ pointer-events:auto; max-width:520px }
#fallback .row{ justify-content:center; margin-top:14px }
#fallback .btn{
  background:rgba(255,255,255,.12); border-color:rgba(255,255,255,.3); color:#eaf4ff;
}
#fallback .btn:hover{ background:rgba(255,255,255,.2) }
#fbCredit{ margin:12px 0 0; font-size:12px; opacity:.65; line-height:1.55 }
#fbCredit a{ color:inherit }
#fbNote{
  margin:12px 0 0; font-size:12.5px; line-height:1.55;
  border:1px solid rgba(255,255,255,.25); border-radius:8px; padding:9px 11px; display:none;
}
#fbNote.on{ display:block }

/* Dải cảnh báo nằm trên bản đồ. Đặt z-index cao hơn #viewport vì viewport
   đứng sau trong DOM (xem ghi chú ở #zoomctl). */
#warnbar{
  position:absolute; left:50%; transform:translateX(-50%); top:12px; z-index:6;
  display:none; align-items:flex-start; gap:10px; max-width:min(680px, calc(100% - 96px));
  background:var(--panel); border:1px solid #f59e0b; border-radius:10px;
  padding:10px 12px; font-size:12.5px; line-height:1.55;
  box-shadow:0 10px 30px rgba(0,0,0,.35);
}
#warnbar.on{ display:flex }
#warnbar .txt{ flex:1 1 auto }
#warnbar .btn{ flex:0 0 auto; padding:4px 9px }

.pin{
  position:absolute; width:28px; height:28px; margin:-14px 0 0 -14px;
  border-radius:50%; border:2px solid rgba(0,0,0,.6);
  display:grid; place-content:center; color:#0b1016;
  box-shadow:0 2px 6px rgba(0,0,0,.5); cursor:pointer; padding:0;
  transform:scale(var(--inv,1)); transform-origin:center;
}
.pin svg{width:17px; height:17px; display:block; pointer-events:none}
/* đánh dấu đã xong: giữ nguyên ký hiệu, gắn thêm tick ở góc */
.pin.found::after{
  content:'✓'; position:absolute; right:-3px; bottom:-3px;
  width:13px; height:13px; border-radius:50%;
  background:#16a34a; color:#fff; font-size:9px; font-weight:800;
  line-height:13px; text-align:center; border:1.5px solid rgba(0,0,0,.5);
}
.pin:hover{outline:2px solid #fff; outline-offset:1px; z-index:5}
.pin.found{opacity:.42; filter:saturate(.35)}
.pin.sel{outline:3px solid #fff; outline-offset:2px; z-index:6}
.pin.hide{display:none}

/* #viewport đứng sau các nút này trong DOM nên nếu không đặt z-index
   thì tấm bản đồ sẽ vẽ đè lên chúng. */
#viewport{z-index:1}
#zoomctl{position:absolute; right:12px; bottom:12px; display:flex; flex-direction:column; gap:6px; z-index:12}
#zoomctl button{
  width:38px; height:38px; border-radius:10px; background:var(--panel);
  border:1px solid var(--line); box-shadow:var(--shadow); font-size:16px;
}
#toggleSide{
  position:absolute; left:12px; top:12px; z-index:12; width:38px; height:38px; border-radius:10px;
  background:var(--panel); border:1px solid var(--line); box-shadow:var(--shadow);
}
/* Đặt ở ĐÁY: đỉnh phải đã có bảng chi tiết, đỉnh trái có nút thu gọn.
   right:70px để chừa cụm nút zoom ở góc dưới phải. */
#editbar{
  position:absolute; left:12px; right:70px; bottom:12px;
  background:var(--panel); border:1px solid var(--accent); border-radius:10px;
  padding:8px 12px; font-size:12.5px; box-shadow:var(--shadow);
  display:none; align-items:center; gap:8px; flex-wrap:wrap; z-index:12;
}
#editbar.on{display:flex}
#editbar .btn{flex:0 0 auto; padding:4px 10px}
#editbar select{width:auto; padding:4px 8px}
#editbar input[type=number]{width:62px; padding:4px 6px}
#editbar .grp{display:flex; align-items:center; gap:6px; flex:0 0 auto}
#ebText{flex:1 1 200px; min-width:160px; color:var(--muted)}
@media (max-width:560px){ #ebText{display:none} }

/* ---------- detail ---------- */
#detail{
  position:absolute; right:12px; top:12px; z-index:15; width:290px; max-height:calc(100% - 24px);
  overflow:auto; background:var(--panel); border:1px solid var(--line);
  border-radius:12px; box-shadow:var(--shadow); display:none;
}
#detail.on{display:block}
#detail .hd{display:flex; align-items:center; gap:9px; padding:12px 14px; border-bottom:1px solid var(--line)}
#detail .hd .sw{width:12px; height:12px; border-radius:4px; flex:0 0 auto}
#detail .hd b{flex:1 1 auto; font-size:14px}
#detail .hd button{background:transparent; border:0; color:var(--muted); font-size:17px; line-height:1}
#detail .bd{padding:12px 14px; display:grid; gap:10px}
#detail .note{color:var(--muted); white-space:pre-wrap}
.chk{display:flex; align-items:center; gap:9px; padding:9px 11px; border:1px solid var(--line); border-radius:9px; background:var(--panel2)}
.chk input{width:17px; height:17px; accent-color:var(--ok)}

#results{position:absolute; left:0; right:0; top:100%; margin-top:5px; background:var(--panel);
  border:1px solid var(--line); border-radius:9px; box-shadow:var(--shadow); max-height:270px;
  overflow:auto; z-index:20; display:none}
#results.on{display:block}
#results button{display:flex; gap:8px; align-items:center; width:100%; background:transparent; border:0; padding:8px 11px; text-align:left}
#results button:hover{background:var(--panel2)}
#results .sw{width:10px; height:10px; border-radius:3px; flex:0 0 auto}
#results small{color:var(--muted); margin-left:auto; white-space:nowrap}

.hintline{color:var(--muted); font-size:12px; margin:8px 0 0}
@media (max-width:720px){
  :root{--side:255px}
  #side{position:absolute; z-index:30; height:100%; box-shadow:var(--shadow)}
  #detail{width:auto; left:12px}
}
</style>
</head>
<body>
<div id="app">

  <aside id="side">
    <div class="sec brand">
      <span class="dot"></span>
      <h1>Bản đồ tương tác<small id="mapName">Final Fantasy IX</small></h1>
      <button class="btn" id="themeBtn" style="flex:0 0 auto" title="Đổi nền sáng/tối">◐</button>
    </div>

    <div class="sec" id="gameSec">
      <label class="fld" for="gameSel">Game</label>
      <select id="gameSel"></select>
    </div>

    <div class="sec">
      <label class="fld" for="mapSel">Bản đồ</label>
      <select id="mapSel"></select>
      <div class="row" style="margin-top:7px">
        <button class="btn" id="imgBtn">🖼 Ảnh bản đồ</button>
      </div>
    </div>

    <div class="sec" style="position:relative">
      <label class="fld" for="q">Tìm kiếm</label>
      <input type="search" id="q" placeholder="Tên địa điểm, ghi chú…" autocomplete="off">
      <div id="results"></div>
    </div>

    <div class="sec" id="routeSec">
      <label class="fld">Chỉ đường</label>
      <div class="row" style="margin-bottom:6px">
        <button class="btn" id="pickA">① Điểm đi</button>
        <button class="btn" id="pickB">② Điểm đến</button>
      </div>
      <div id="routeOut" style="font-size:12.5px"></div>
      <div class="row" style="margin-top:6px">
        <button class="btn" id="clrRoute">Xoá tuyến</button>
        <button class="btn on" id="showEdges">Hiện tuyến</button>
        <button class="btn" id="cluBtn">🧩 Xem cụm</button>
      </div>
    </div>

    <div class="sec" id="progSec" style="padding-bottom:6px">
      <div class="pstat"><span>Tiến độ</span><span id="pTxt">0 / 0</span></div>
      <div class="bar"><i id="pBar"></i></div>
    </div>

    <div id="catlist"></div>

    <div class="sec">
      <div class="row" style="margin-bottom:7px">
        <button class="btn" id="allOn">Hiện hết</button>
        <button class="btn" id="allOff">Ẩn hết</button>
      </div>
      <div class="row">
        <button class="btn" id="editBtn">✎ Biên tập</button>
        <button class="btn" id="expBtn">Xuất JSON</button>
      </div>
      <div class="row" style="margin-top:7px">
        <button class="btn" id="impBtn">Nhập JSON</button>
        <button class="btn danger" id="resetBtn">Xoá tiến độ</button>
      </div>
      <input type="file" id="impFile" accept="application/json" hidden>
      <input type="file" id="imgFile" accept="image/*" hidden>
      <p class="hintline">Phím tắt: <b>/</b> tìm · <b>+ −</b> phóng · <b>0</b> vừa màn hình · <b>Esc</b> đóng</p>
    </div>
  </aside>

  <main id="stage">
    <button id="toggleSide" title="Ẩn/hiện bảng bên">☰</button>
    <div id="editbar">
      <span id="ebText">✎ Bấm bản đồ để thêm điểm · kéo điểm để di chuyển</span>
      <span class="grp">
        <button class="btn" id="undoBtn" title="Hoàn tác (Ctrl/Cmd + Z)">↶ Hoàn tác</button>
        <button class="btn danger" id="revertBtn"
                title="Bỏ mọi chỉnh sửa, quay về dữ liệu gốc của game">↺ Về dữ liệu gốc</button>
      </span>
      <span class="grp" id="linkGrp">
        <button class="btn" id="linkBtn">🔗 Nối điểm</button>
        <select id="linkType" title="Phương tiện cho tuyến sắp vẽ"></select>
      </span>
      <span class="grp" id="hubGrp">
        <button class="btn" id="portBtn">⚓ Nối bến tàu</button>
      </span>
      <span class="grp" id="autoGrp">
        <button class="btn" id="cleanBtn"
                title="Xoá tuyến đi bộ nối hai khối đất khác nhau">🧹 Dọn tuyến lố</button>
        <button class="btn" id="autoBtn">⚡ Nối gần</button>
        <input type="number" id="autoR" value="12" min="2" max="60" step="1"
               title="Bán kính nối, tính theo % chiều rộng bản đồ">
        <span style="color:var(--muted)">%</span>
      </span>
    </div>

    <div id="viewport">
      <div id="world">
        <img id="mapimg" alt="Bản đồ" draggable="false">
        <svg id="links" aria-hidden="true"></svg>
        <div id="pins"></div>
      </div>
      <div id="fallback">
        <div>
          <h2 style="margin:0 0 8px" id="fbTitle">Chưa có ảnh bản đồ</h2>
          <p style="margin:0; opacity:.8" id="fbText">Đặt ảnh vào <code>maps/world.png</code></p>
          <div class="row" id="fbActions">
            <button class="btn" id="fbPick">📁 Chọn ảnh từ máy</button>
            <button class="btn" id="fbRemote">🌐 Dùng bản đồ mặc định</button>
            <button class="btn" id="fbFile">📂 Ảnh trong maps/</button>
            <button class="btn" id="fbClose">✕ Đóng</button>
          </div>
          <p id="fbCredit"></p>
          <p id="fbNote"></p>
          <p style="margin:12px 0 0; opacity:.6; font-size:13px">Vẫn đặt và sửa marker bình thường được.</p>
        </div>
      </div>
    </div>

    <div id="warnbar">
      <span>⚠️</span>
      <span class="txt" id="warnTxt"></span>
      <button class="btn" id="warnFix">Chọn ảnh khác</button>
      <button class="btn" id="warnClose">✕</button>
    </div>

    <div id="zoomctl">
      <button id="zIn" title="Phóng to">+</button>
      <button id="zOut" title="Thu nhỏ">−</button>
      <button id="zFit" title="Vừa màn hình">⤢</button>
    </div>
  </main>
</div>

<div id="detail">
  <div class="hd"><span class="sw" id="dSw"></span><b id="dTitle">—</b><button id="dClose">✕</button></div>
  <div class="bd" id="dBody"></div>
</div>

<script>
(() => {
'use strict';

/* ==================================================================
   CONFIG — chỉ còn thiết lập của ENGINE.

   Dữ liệu từng game (nhóm điểm, phương tiện, điểm đặt sẵn, luật nối
   tuyến) KHÔNG còn ở đây nữa — nó nằm trong data/<game>.js và tự đăng
   ký vào window.MAPGAMES. Engine nạp các file đó bằng thẻ <script>
   chèn động, KHÔNG dùng fetch() và KHÔNG dùng import: mở trang bằng
   file:// là cả hai đều bị chặn.
   ================================================================== */
const CONFIG = {
  /* Danh sách game. File này khai có những game nào và dữ liệu của mỗi
     game nằm ở file nào — engine chỉ nạp file của game đang xem. */
  gameList: 'data/games.js',

  zoom: {
    min: 0.05, max: 8,
    wheel: 0.0016,   // nhỏ hơn = lăn chuột zoom chậm hơn
    step: 1.3,       // mức zoom của nút + / −
    maxPerEvent: 1.22, // chặn một cú lăn mạnh làm nhảy vọt
  },
  limits: {
    /* Mỗi marker là một phần tử DOM. FFIX 44 điểm thì thoải mái, nhưng
       game open world có thể 1000–3000 điểm, mà cách vẽ bằng DOM hiện
       tại đuối dần từ khoảng 500 trở lên.

       CHƯA tối ưu ở đây — chỉ cảnh báo ra console. Khi thật sự cần thì
       có hai đường: (a) vẽ marker bằng <canvas> và chỉ dựng DOM cho
       điểm đang mở bảng chi tiết, hoặc (b) giữ DOM nhưng chỉ dựng phần
       lọt khung nhìn, dựng lại khi pan/zoom xong. */
    markerDom: 500,
  },
};

/* Bộ dữ liệu game đang mở — gán trong applyGame(). Engine không được
   giả định bất kỳ id nhóm hay id phương tiện nào của riêng game nào. */
let GAME = null;

/* ================= trạng thái ================= */
const $ = s => document.querySelector(s);
let catById  = new Map();
let linkById = new Map();
const SVGNS = 'http://www.w3.org/2000/svg';
/* Ký hiệu nhóm. Vẽ bằng SVG nội tuyến nên không lệ thuộc font hay emoji
   của hệ điều hành — máy nào cũng hiện giống nhau. */
const glyph = cat => {
  const c = catById.get(cat);
  if (!c || !c.icon) return '';
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
         'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + c.icon + '</svg>';
};

let markers = [];
let edges = [];                 // {id, map, a, b, type}
let found = new Set();
let hidden = new Set();
let curMap = null;
let editing = false, linking = false;
let selected = null, linkFrom = null;
let routeA = null, routeB = null, pickMode = null, routePath = [];
let showEdges = true, clusterMode = false;
const CLU = ['#f87171','#60a5fa','#fbbf24','#34d399','#c084fc',
             '#f472b6','#22d3ee','#a3e635','#fb923c','#94a3b8'];
let nextId = 1, nextEdge = 1;

const view = { x:0, y:0, s:1 };
let imgW = 2000, imgH = 2000;

const viewport = $('#viewport'), world = $('#world');
const img = $('#mapimg'), pinsEl = $('#pins'), fallback = $('#fallback'), svg = $('#links');

/* ================= lưu trữ ================= */
/* Tiền tố chung của mọi khoá localStorage. Đổi tiền tố này là coi như
   dữ liệu cũ không còn đọc được — nên chỉ đổi khi đổi cấu trúc lưu. */
const NS = 'ffmap.v2.';

/* Khoá theo GAME — nhiều game cùng tồn tại mà không đè nhau. Riêng theme
   là thiết lập của người dùng, không thuộc game nào, nên để toàn cục:
   đổi game mà nền nhảy từ tối sang sáng thì vô lý. */
let K = {};
const K_THEME = NS + 'theme';
const K_GAME  = NS + 'game';    // id game mở lần trước
function load(key, fb){
  try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fb; }
  catch{ return fb; }
}
function save(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); } catch{ /* chế độ riêng tư */ }
}
const seedMarkers = () =>
  GAME.seed.map((r,i) => ({ id:i+1, map:r[0], cat:r[1], name:r[2], x:r[3], y:r[4],
                            note:r[5], land:r[6] }));

/* Hai điểm có đi bộ sang nhau được không. Bộ dữ liệu khai "khối đất" cho
   từng điểm; khác khối thì phải tàu hoặc phi thuyền.

   Điểm do người dùng tự thêm KHÔNG có khối đất — lúc đó trả về true, để
   engine đừng chặn thứ nó không biết. Thà nối lố một đường dễ xoá còn hơn
   âm thầm từ chối nối mà không nói vì sao. */
const sameLand = (a, b) => !a || !b || !a.land || !b.land || a.land === b.land;

/* Marker lưu từ bản cũ không có trường land. Bù lại theo TÊN — tên là thứ
   ổn định nhất giữa các bản, id thì người dùng biên tập là đổi. Điểm người
   dùng tự đặt không khớp tên nào thì để trống, và sameLand() sẽ không chặn
   nó — engine chỉ nên chắc chắn về thứ bộ dữ liệu có nói. */
function hydrateLand(){
  const byName = new Map((GAME.seed || []).map(r => [r[2], r[6]]).filter(x => x[1]));
  let n = 0;
  for (const p of markers) if (!p.land && byName.has(p.name)){ p.land = byName.get(p.name); n++; }
  if (n) persist();
  return n;
}

/* Cờ tính năng. Thiếu khoá thì coi như BẬT — bộ dữ liệu cũ không khai
   features vẫn chạy đủ như trước. */
const feat = k => !GAME || (GAME.features || {})[k] !== false;

function boot(){
  const saved = load(K.data, null);
  markers = Array.isArray(saved) && saved.length ? saved : seedMarkers();
  hydrateLand();
  edges   = load(K.edges, []) || [];
  nextId    = markers.reduce((m,p) => Math.max(m, p.id), 0) + 1;
  nextEdge  = edges.reduce((m,e) => Math.max(m, e.id), 0) + 1;
  found  = new Set(load(K.found, []));
  hidden = new Set(load(K.hidden, []));
  const th = load(K_THEME, null);
  if (th) document.documentElement.dataset.theme = th;
}
const persist  = () => save(K.data, markers);
const persistE = () => save(K.edges, edges);

/* ================= ảnh bản đồ ================= */
/* Ảnh người dùng tự chọn nặng vài MB — localStorage không chứa nổi, nên
   lưu Blob vào IndexedDB, khoá theo "<game>:<bản đồ>".

   Safari CHẶN IndexedDB khi mở bằng file://. Không có cách nào vòng qua,
   nên đường lùi là: giữ ảnh trong RAM cho phiên đang mở và NÓI THẲNG với
   người dùng rằng lần sau phải chọn lại — im lặng để họ tưởng đã lưu mới
   là tệ. Mọi lỗi ở đây đều rơi về đường lùi đó, kể cả khi trình duyệt
   treo không trả lời (có timeout).

   [ĐO 2026-09-20, WebKit 26.6 qua file://] Safari KHÔNG ném lỗi ở
   indexedDB.open — open chạy qua bình thường, rồi GIAO DỊCH mới hỏng, và
   tx.error khi đó là NULL. Nên đừng bỏ mấy chỗ "|| new Error(...)" bên
   dưới: thiếu nó là reject(null), rồi err.message ở chỗ bắt lỗi ném tiếp
   một TypeError, và người dùng mất luôn cái cảnh báo lẽ ra phải thấy.
   Đo cùng lượt: app chạy đủ trên WebKit — 44 điểm, undo, nối bến tàu đều
   bình thường; chỉ riêng lưu ảnh là không được, và đường lùi bắt đúng. */
const IDB = {
  name:'mapatlas', store:'maps', broken:false, db:null,
  open(){
    if (this.db)     return Promise.resolve(this.db);
    if (this.broken) return Promise.reject(new Error('IndexedDB không dùng được'));
    return new Promise((res, rej) => {
      const fail = e => { this.broken = true; rej(e instanceof Error ? e : new Error(String(e))); };
      let rq;
      try { rq = indexedDB.open(this.name, 1); } catch(e){ return fail(e); }
      const t = setTimeout(() => fail(new Error('IndexedDB không trả lời')), 3000);
      rq.onupgradeneeded = () => { try{ rq.result.createObjectStore(this.store); }catch{} };
      rq.onsuccess = () => { clearTimeout(t); this.db = rq.result; res(this.db); };
      rq.onerror   = () => { clearTimeout(t); fail(rq.error || new Error('mở IndexedDB lỗi')); };
      rq.onblocked = () => { clearTimeout(t); fail(new Error('IndexedDB đang bị khoá')); };
    });
  },
  async run(mode, fn){
    const db = await this.open();
    return new Promise((res, rej) => {
      const tx = db.transaction(this.store, mode);
      const rq = fn(tx.objectStore(this.store));
      tx.onerror = () => rej(tx.error || new Error('giao dịch IndexedDB lỗi'));
      tx.oncomplete = () => res(rq ? rq.result : undefined);
    });
  },
  get(k){ return this.run('readonly',  st => st.get(k)); },
  put(k, v){ return this.run('readwrite', st => st.put(v, k)); },
  del(k){ return this.run('readwrite', st => st.delete(k)); },
};

/* Đường lùi khi IndexedDB không lưu được: ảnh sống đúng phiên này. */
const sessionImages = new Map();
const imgKey = mapId => GAME.id + ':' + mapId;

/* Ảnh nào đang dùng cho từng bản đồ: 'custom' (người dùng chọn) |
   'remote' (ảnh mặc định trên mạng) | không có (file trong maps/). */
const imgPref     = ()      => load(K.imgPref, {}) || {};
const setImgPref  = (id, v) => { const o = imgPref(); v ? (o[id] = v) : delete o[id]; save(K.imgPref, o); };

/* Chỉ một objectURL sống mỗi lúc — quên thu hồi là rò bộ nhớ dần. */
let curObjectURL = null;
function showImage(url, isObject){
  if (curObjectURL){ URL.revokeObjectURL(curObjectURL); curObjectURL = null; }
  if (isObject) curObjectURL = url;
  img.src = url || '';
}

/* ================= hoàn tác ================= */
/* Chụp nguyên trạng thái thay vì ghi lệnh nghịch đảo. Đắt hơn về bộ nhớ,
   nhưng mỗi thao tác chỉ cần một dòng pushUndo() và không có cách nào
   hoàn tác sai — còn lệnh nghịch đảo thì mỗi loại thao tác là một cơ hội
   viết sai riêng, mà thao tác hàng loạt (nối bến tàu, nối gần, nhập JSON)
   thì nghịch đảo càng rắc rối.

   Stack KHÔNG lưu xuống localStorage: tải lại trang là mất. Lưu thì phải
   ghi vài MB mỗi thao tác, mà undo xuyên phiên cũng không ai trông đợi. */
const UNDO_MAX = 30;
let undoStack = [];

/* Bản đồ 1000–3000 điểm thì mỗi bản chụp nặng hẳn, nên giữ ít bước lại.
   Xem CONFIG.limits.markerDom. */
const undoCap = () => (markers.length > CONFIG.limits.markerDom ? 10 : UNDO_MAX);

const takeSnapshot = label => ({
  label,
  markers: markers.map(p => ({ ...p })),
  edges:   edges.map(e => ({ ...e })),
  found:   [...found],
});

function pushUndo(label){
  undoStack.push(takeSnapshot(label));
  while (undoStack.length > undoCap()) undoStack.shift();
  syncUndo();
}

/* Kéo điểm: phải chụp TRƯỚC khi kéo, nhưng lúc bấm xuống chưa biết người
   dùng sẽ kéo hay chỉ bấm chọn. Nên chụp sẵn rồi chỉ ghi nhận khi thật
   sự có di chuyển — bấm hụt không được đẻ ra một bước hoàn tác rỗng. */
let pendingUndo = null;
const holdUndo   = label => { pendingUndo = takeSnapshot(label); };
const commitUndo = () => {
  if (!pendingUndo) return;
  undoStack.push(pendingUndo);
  pendingUndo = null;
  while (undoStack.length > undoCap()) undoStack.shift();
  syncUndo();
};
const dropUndo = () => { pendingUndo = null; };

function undo(){
  const snap = undoStack.pop();
  if (!snap) return;
  markers = snap.markers;
  edges   = snap.edges;
  found   = new Set(snap.found);

  /* nextId KHÔNG lùi lại: id đã cấp thì đừng cấp lại. Dùng lại một id vừa
     bị hoàn tác là điểm mới thừa hưởng trạng thái "đã hoàn thành" của
     điểm cũ — một lỗi rất khó lần ra. */
  nextId   = Math.max(nextId,   markers.reduce((m,p) => Math.max(m, p.id), 0) + 1);
  nextEdge = Math.max(nextEdge, edges.reduce((m,e) => Math.max(m, e.id), 0) + 1);

  const alive = new Set(markers.map(p => p.id));
  if (!alive.has(routeA))   routeA = null;
  if (!alive.has(routeB))   routeB = null;
  if (!alive.has(linkFrom)) linkFrom = null;
  if (!alive.has(selected)) selected = null;

  persist(); persistE(); save(K.found, [...found]);
  closeDetail(); refresh(); syncUndo();
}

function syncUndo(){
  const b = $('#undoBtn');
  if (!b) return;
  const n = undoStack.length;
  b.disabled = !n;
  b.style.opacity = n ? '' : '.45';
  b.textContent = n ? '↶ Hoàn tác (' + n + ')' : '↶ Hoàn tác';
  b.title = n ? 'Hoàn tác: ' + undoStack[n-1].label + ' — Ctrl/Cmd + Z' : 'Chưa có gì để hoàn tác';
}

$('#undoBtn').addEventListener('click', undo);

/* Bỏ hết chỉnh sửa, quay về đúng bộ dữ liệu trong data/<game>.js.
   Khác hẳn nút "Xoá tiến độ" ở cột trái: nút kia chỉ bỏ mấy ô tick, nút
   này thay toàn bộ marker và tuyến.

   Hỏi hai lần, và lần đầu nói rõ SẼ MẤT GÌ bằng số đếm thật — "bạn có
   chắc không?" mà không kèm con số thì người ta bấm Đồng ý theo phản xạ.
   Vẫn hoàn tác được ngay sau đó, nhưng chỉ trong phiên này. */
function revertToSeed(){
  const seed  = seedMarkers();
  const byId  = new Map(seed.map(p => [p.id, p]));
  const added = markers.filter(p => !byId.has(p.id)).length;
  const edited = markers.filter(p => {
    const o = byId.get(p.id);
    return o && (o.name !== p.name || o.cat !== p.cat || o.note !== (p.note || '') ||
                 Math.abs(o.x - p.x) > 1e-9 || Math.abs(o.y - p.y) > 1e-9);
  }).length;

  if (!added && !edited && !edges.length && markers.length === seed.length){
    alert('Dữ liệu đang đúng như bản gốc rồi, không có gì để bỏ.');
    return;
  }
  if (!confirm(
    'Quay về dữ liệu gốc của "' + GAME.name + '"?\n\n' +
    'Sẽ mất:\n' +
    '· ' + added + ' điểm tự thêm\n' +
    '· ' + edited + ' điểm đã sửa (tên, nhóm, ghi chú hoặc vị trí)\n' +
    '· ' + edges.length + ' tuyến đã vẽ\n\n' +
    'Áp cho TOÀN BỘ bản đồ của game này, không riêng bản đồ đang mở.\n' +
    'Nên bấm "Xuất JSON" trước để giữ một bản sao.')) return;
  if (!confirm('Chắc chắn bỏ hết?\n\nHoàn tác được bằng ↶ ngay sau đó, ' +
               'nhưng tải lại trang là mất đường lùi.')) return;

  pushUndo('về dữ liệu gốc');
  markers = seed;
  edges   = [];
  /* Giữ các ô đã tick, nhưng bỏ tick của những điểm không còn tồn tại —
     để lại là con số tiến độ đếm cả thứ đã biến mất. */
  const alive = new Set(seed.map(p => p.id));
  found = new Set([...found].filter(id => alive.has(id)));
  nextId   = Math.max(nextId,   seed.reduce((m,p) => Math.max(m, p.id), 0) + 1);
  routeA = routeB = linkFrom = null; routePath = [];

  persist(); persistE(); save(K.found, [...found]);
  closeDetail(); refresh();
  alert('Đã quay về dữ liệu gốc: ' + seed.length + ' điểm, 0 tuyến.');
}
$('#revertBtn').addEventListener('click', revertToSeed);

/* ================= khung nhìn ================= */
function applyView(){
  world.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.s})`;
  world.style.setProperty('--inv', String(1 / view.s));
}
function clampView(){
  const r = viewport.getBoundingClientRect();
  const w = imgW * view.s, h = imgH * view.s;
  const pad = 80;
  view.x = w < r.width  ? (r.width  - w) / 2 : Math.min(pad, Math.max(r.width  - w - pad, view.x));
  view.y = h < r.height ? (r.height - h) / 2 : Math.min(pad, Math.max(r.height - h - pad, view.y));
}
function fit(){
  const r = viewport.getBoundingClientRect();
  view.s = Math.min(r.width / imgW, r.height / imgH) * 0.96;
  view.x = (r.width  - imgW * view.s) / 2;
  view.y = (r.height - imgH * view.s) / 2;
  applyView();
}
function zoomAt(cx, cy, mul){
  const Z = CONFIG.zoom;
  const r = viewport.getBoundingClientRect();
  const px = cx - r.left, py = cy - r.top;
  const ns = Math.min(Z.max, Math.max(Z.min, view.s * mul));
  if (Math.abs(ns - view.s) < 1e-6) return;
  view.x = px - (px - view.x) * (ns / view.s);
  view.y = py - (py - view.y) * (ns / view.s);
  view.s = ns;
  clampView(); applyView();
}
const zoomCenter = m => {
  const r = viewport.getBoundingClientRect();
  zoomAt(r.left + r.width/2, r.top + r.height/2, m);
};

/* ================= đồ thị & tìm đường ================= */
const dist = (a,b) => Math.hypot((a.x-b.x)*imgW, (a.y-b.y)*imgH);

function neighbours(id){
  const out = [];
  for (const e of edges){
    if (e.map !== curMap) continue;
    if (e.a === id) out.push([e.b, e]);
    else if (e.b === id) out.push([e.a, e]);
  }
  return out;
}
/** Các cụm liên thông trên bản đồ hiện tại, cụm to xếp trước.
    Dùng để biết còn thiếu tuyến tàu ở đâu: mỗi cụm là một khối đất
    chưa có đường sang khối khác. */
function components(){
  const pts = markers.filter(p => p.map === curMap);
  const parent = new Map(pts.map(p => [p.id, p.id]));
  const find = x => { while (parent.get(x) !== x){ parent.set(x, parent.get(parent.get(x))); x = parent.get(x); } return x; };
  for (const e of edges){
    if (e.map !== curMap || !parent.has(e.a) || !parent.has(e.b)) continue;
    const a = find(e.a), b = find(e.b);
    if (a !== b) parent.set(a, b);
  }
  const g = new Map();
  for (const p of pts){
    const r = find(p.id);
    if (!g.has(r)) g.set(r, []);
    g.get(r).push(p);
  }
  return [...g.values()].sort((a,b) => b.length - a.length);
}
const clusterOf = (() => {
  let cache = null, stamp = '';
  return id => {
    const key = curMap + ':' + markers.length + ':' + edges.length;
    if (stamp !== key){ cache = new Map(); stamp = key;
      components().forEach((grp,i) => grp.forEach(p => cache.set(p.id, i))); }
    return cache.get(id) ?? 0;
  };
})();

/** Dijkstra — đồ thị nhỏ nên quét tuyến tính là đủ nhanh. */
function findRoute(from, to){
  if (from === to) return [];
  const byId = new Map(markers.filter(p => p.map === curMap).map(p => [p.id, p]));
  if (!byId.has(from) || !byId.has(to)) return null;

  const distTo = new Map([[from, 0]]);
  const prev = new Map();
  const done = new Set();

  for(;;){
    let cur = null, best = Infinity;
    for (const [id, d] of distTo){
      if (!done.has(id) && d < best){ best = d; cur = id; }
    }
    if (cur === null) break;
    if (cur === to) break;
    done.add(cur);

    for (const [nb, e] of neighbours(cur)){
      if (done.has(nb) || !byId.has(nb)) continue;
      const t = linkById.get(e.type) || { cost:1 };
      const w = dist(byId.get(cur), byId.get(nb)) * t.cost;
      const nd = best + w;
      if (nd < (distTo.get(nb) ?? Infinity)){
        distTo.set(nb, nd);
        prev.set(nb, { from:cur, edge:e });
      }
    }
  }
  if (!prev.has(to) && from !== to) return null;

  const steps = [];
  let at = to;
  while (at !== from){
    const p = prev.get(at);
    if (!p) return null;
    steps.unshift({ from:p.from, to:at, edge:p.edge });
    at = p.from;
  }
  return steps;
}

function renderRoute(){
  const out = $('#routeOut');
  const nameOf = id => (markers.find(p => p.id === id) || {}).name || '—';
  routePath = [];

  const nEdge = edges.filter(e => e.map === curMap).length;
  const comps = components();
  const warn = comps.length > 1
    ? '<div style="margin-top:7px;padding:8px 10px;border:1px solid var(--line);border-radius:8px">' +
      '🧩 Đồ thị đang chia thành <b>' + comps.length + ' cụm rời nhau</b> — ' +
      'cần <b>' + (comps.length - 1) + ' tuyến tàu</b> nữa. ' +
      'Mẹo: <b>✎ Biên tập → ⚓ Nối bến tàu</b>.' +
      '<div style="margin-top:6px">' + comps.slice(0,6).map((g,i) =>
        '<div class="clu"><span class="sw" style="background:' + CLU[i % CLU.length] + '"></span>' +
        '<span class="nm">' + esc(g[0].name) + '</span><span class="ct">' + g.length + ' điểm</span></div>').join('') +
      (comps.length > 6 ? '<div class="clu" style="color:var(--muted)">… và ' + (comps.length-6) + ' cụm nhỏ nữa</div>' : '') +
      '</div></div>'
    : (nEdge ? '<div style="margin-top:7px;color:var(--ok)">✓ Mọi điểm đều đi tới được nhau.</div>' : '');

  if (!routeA && !routeB){
    out.innerHTML = '<span style="color:var(--muted)">Bấm ① rồi chọn một điểm trên bản đồ.<br>' +
                    'Bản đồ đang có <b>' + nEdge + '</b> tuyến.</span>' + warn;
    renderEdges(); return;
  }
  const head =
    '<div style="margin-bottom:6px">① <b>' + esc(routeA ? nameOf(routeA) : 'chưa chọn') + '</b>' +
    '<br>② <b>' + esc(routeB ? nameOf(routeB) : 'chưa chọn') + '</b></div>';

  if (!routeA || !routeB){ out.innerHTML = head; renderEdges(); return; }

  const steps = findRoute(routeA, routeB);
  if (steps === null){
    const n = edges.filter(e => e.map === curMap).length;
    out.innerHTML = head + (n === 0
      ? '<div style="color:var(--muted)">Bản đồ <b>chưa có tuyến nào</b> — app không tự biết ' +
        'chỗ nào đi được sang chỗ nào, phải vẽ ra.</div>' +
        '<button class="btn" id="autoNow" style="margin-top:7px">⚡ Dựng mạng đường bộ ngay</button>'
      : '<div style="color:#ef4444">Hai điểm này chưa thông nhau.<br>' +
        'Thiếu một chặng ở giữa — nhiều khả năng là tuyến tàu vượt biển.</div>' + warn);
    const now = $('#autoNow');
    if (now) now.addEventListener('click', () => autoConnect(12));
    renderEdges(); return;
  }
  if (steps.length === 0){ out.innerHTML = head; renderEdges(); return; }

  routePath = steps;
  let total = 0;
  const li = steps.map(s => {
    const t = linkById.get(s.edge.type) || { name:s.edge.type, color:'#94a3b8', cost:1 };
    const A = markers.find(p => p.id === s.from), B = markers.find(p => p.id === s.to);
    total += dist(A, B) * t.cost;
    return '<li><b>' + esc(B.name) + '</b> ' +
           '<span class="pill" style="background:' + t.color + '">' + esc(t.name) + '</span></li>';
  }).join('');

  out.innerHTML = head +
    '<div style="margin-bottom:5px">' + steps.length + ' chặng</div>' +
    '<ol class="steps">' + li + '</ol>';
  renderEdges();
}

/* ================= vẽ ================= */
function esc(s){ return String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

function renderEdges(){
  svg.setAttribute('width', imgW);
  svg.setAttribute('height', imgH);
  svg.setAttribute('viewBox', '0 0 ' + imgW + ' ' + imgH);
  svg.classList.toggle('hidden', !showEdges);
  svg.style.pointerEvents = linking ? 'auto' : 'none';
  svg.textContent = '';

  const byId = new Map(markers.map(p => [p.id, p]));
  const frag = document.createDocumentFragment();

  for (const e of edges){
    if (e.map !== curMap) continue;
    const A = byId.get(e.a), B = byId.get(e.b);
    if (!A || !B) continue;
    const t = linkById.get(e.type) || { color:'#94a3b8' };
    const ln = document.createElementNS(SVGNS, 'line');
    ln.setAttribute('x1', A.x*imgW); ln.setAttribute('y1', A.y*imgH);
    ln.setAttribute('x2', B.x*imgW); ln.setAttribute('y2', B.y*imgH);
    ln.setAttribute('stroke', t.color);
    ln.setAttribute('class', 'edge');
    ln.dataset.id = String(e.id);
    frag.appendChild(ln);
  }
  for (const s of routePath){
    const A = byId.get(s.from), B = byId.get(s.to);
    if (!A || !B) continue;
    const t = linkById.get(s.edge.type) || { color:'#fff' };
    const ln = document.createElementNS(SVGNS, 'line');
    ln.setAttribute('x1', A.x*imgW); ln.setAttribute('y1', A.y*imgH);
    ln.setAttribute('x2', B.x*imgW); ln.setAttribute('y2', B.y*imgH);
    ln.setAttribute('stroke', t.color);
    ln.setAttribute('class', 'route');
    frag.appendChild(ln);
  }
  svg.appendChild(frag);
}

let warnedScale = false;
function renderPins(){
  const onMap = markers.filter(p => p.map === curMap).length;
  if (!warnedScale && onMap > CONFIG.limits.markerDom){
    warnedScale = true;
    console.warn('[bản đồ] ' + onMap + ' marker trên một bản đồ, vượt ngưỡng ' +
      CONFIG.limits.markerDom + ' mà cách vẽ bằng DOM chịu được. Pan/zoom sẽ bắt đầu giật. ' +
      'Hướng xử lý: vẽ marker bằng <canvas>, hoặc chỉ dựng DOM cho phần lọt khung nhìn ' +
      '(xem CONFIG.limits.markerDom).');
  }
  pinsEl.textContent = '';
  const frag = document.createDocumentFragment();
  for (const p of markers){
    if (p.map !== curMap) continue;
    const c = catById.get(p.cat) || { color:'#9ca3af', name:p.cat };
    const el = document.createElement('button');
    let cls = 'pin';
    if (found.has(p.id)) cls += ' found';
    if (hidden.has(p.cat)) cls += ' hide';
    if (p.id === selected) cls += ' sel';
    if (p.id === routeA) cls += ' rstart';
    if (p.id === routeB) cls += ' rend';
    if (p.id === linkFrom) cls += ' linksel';
    el.className = cls;
    el.style.background = clusterMode ? CLU[clusterOf(p.id) % CLU.length] : c.color;
    el.style.left = (p.x * imgW) + 'px';
    el.style.top  = (p.y * imgH) + 'px';
    el.dataset.id = String(p.id);
    el.title = p.name;
    el.setAttribute('aria-label', p.name + ' — ' + c.name);
    el.innerHTML = glyph(p.cat);
    frag.appendChild(el);
  }
  pinsEl.appendChild(frag);
}

function renderCats(){
  const box = $('#catlist');
  box.textContent = '';
  for (const c of GAME.cats){
    const all = markers.filter(p => p.map === curMap && p.cat === c.id);
    if (all.length === 0 && !editing) continue;
    const got = all.filter(p => found.has(p.id)).length;
    const b = document.createElement('button');
    b.className = 'cat' + (hidden.has(c.id) ? ' off' : '');
    b.innerHTML =
      '<span class="sw" style="background:' + c.color + '">' + glyph(c.id) + '</span>' +
      '<span class="nm"></span><span class="ct">' +
      (feat('progress') ? got + '/' + all.length : String(all.length)) + '</span>';
    b.querySelector('.nm').textContent = c.name;
    b.addEventListener('click', () => {
      hidden.has(c.id) ? hidden.delete(c.id) : hidden.add(c.id);
      save(K.hidden, [...hidden]);
      renderPins(); renderCats();
    });
    box.appendChild(b);
  }
}
function renderProgress(){
  if (!feat('progress')) return;
  const all = markers.filter(p => p.map === curMap);
  const got = all.filter(p => found.has(p.id)).length;
  $('#pTxt').textContent = got + ' / ' + all.length;
  $('#pBar').style.width = all.length ? (got / all.length * 100) + '%' : '0%';
}
const refresh = () => {
  renderPins(); renderCats(); renderProgress();
  /* routing tắt thì không có khung Chỉ đường để vẽ vào, nhưng tuyến
     trên bản đồ vẫn phải được vẽ — nên gọi thẳng renderEdges(). */
  feat('routing') ? renderRoute() : renderEdges();
};

/* ================= bảng chi tiết ================= */

  selected = id;

    const opts = GAME.cats.map(x =>
      '<option value="' + x.id + '"' + (x.id === p.cat ? ' selected' : '') + '>' + esc(x.name) + '</option>').join('');
    const deg = neighbours(p.id).length;
    body.innerHTML =
      '<div><label class="fld">Tên</label><input type="text" id="eName" value="' + esc(p.name) + '"></div>' +
      '<div><label class="fld">Nhóm</label><select id="eCat">' + opts + '</select></div>' +
      '<div><label class="fld">Ghi chú</label><textarea id="eNote">' + esc(p.note || '') + '</textarea></div>' +
      '<div style="color:var(--muted);font-size:12px">x ' + p.x.toFixed(4) + ' · y ' + p.y.toFixed(4) +
      ' · ' + deg + ' tuyến nối</div>' +
      '<div class="row"><button class="btn" id="eSave">Lưu</button>' +
      '<button class="btn danger" id="eDel">Xoá điểm</button></div>';
    $('#eSave').addEventListener('click', () => {
      pushUndo('sửa điểm "' + p.name + '"');
      p.name = $('#eName').value.trim() || 'Không tên';
      p.cat  = $('#eCat').value;
      p.note = $('#eNote').value.trim();
      persist(); refresh(); openDetail(p.id);
    });
    $('#eDel').addEventListener('click', () => {
      pushUndo('xoá điểm "' + p.name + '"');
      markers = markers.filter(m => m.id !== p.id);
      edges   = edges.filter(e => e.a !== p.id && e.b !== p.id);   // dọn tuyến mồ côi
      found.delete(p.id);
      if (routeA === p.id) routeA = null;
      if (routeB === p.id) routeB = null;
      persist(); persistE(); save(K.found, [...found]);

  renderPins();
}
function closeDetail(){
  selected = null;
  $('#detail').classList.remove('on');
  renderPins();
}

/* ================= kéo / thả / phóng ================= */
let drag = null, pinDrag = null, moved = 0;
const pointers = new Map();
let pinchStart = null;

viewport.addEventListener('pointerdown', ev => {
  /* Màn chọn ảnh nằm TRONG #viewport. Nếu để viewport bắt con trỏ ở đây
     thì setPointerCapture bên dưới nuốt luôn pointerup, và trình duyệt
     KHÔNG sinh sự kiện click cho nút bên trong màn đó — nút trông bấm
     được mà bấm không ăn gì. Vùng nền của màn có pointer-events:none nên
     vẫn rơi xuống viewport như thường, chỉ hộp nút là được miễn trừ. */
  if (ev.target.closest('#fallback')) return;
  viewport.setPointerCapture(ev.pointerId);
  pointers.set(ev.pointerId, { x:ev.clientX, y:ev.clientY });

  if (pointers.size === 2){
    const [a,b] = [...pointers.values()];
    pinchStart = { d: Math.hypot(a.x-b.x, a.y-b.y), s: view.s };
    drag = null; pinDrag = null;
    return;
  }

  const pinEl = ev.target.closest('.pin');
  moved = 0;

  if (pinEl && editing && !linking){
    pinDrag = { el:pinEl, id:+pinEl.dataset.id, ox:ev.clientX, oy:ev.clientY };
    holdUndo('di chuyển điểm');
    return;
  }
  drag = { px:ev.clientX, py:ev.clientY, vx:view.x, vy:view.y,
           pin:pinEl, edge:ev.target.closest('line.edge'),
           ox:ev.clientX, oy:ev.clientY };
  viewport.classList.add('drag');
});

viewport.addEventListener('pointermove', ev => {
  if (pointers.has(ev.pointerId)) pointers.set(ev.pointerId, { x:ev.clientX, y:ev.clientY });

  if (pinchStart && pointers.size === 2){
    const [a,b] = [...pointers.values()];
    const d = Math.hypot(a.x-b.x, a.y-b.y);
    const Z = CONFIG.zoom;
    const r = viewport.getBoundingClientRect();
    const ns = Math.min(Z.max, Math.max(Z.min, pinchStart.s * (d / pinchStart.d)));
    const cx = (a.x + b.x) / 2 - r.left, cy = (a.y + b.y) / 2 - r.top;
    view.x = cx - (cx - view.x) * (ns / view.s);
    view.y = cy - (cy - view.y) * (ns / view.s);
    view.s = ns;
    clampView(); applyView();
    return;
  }

  if (pinDrag){
    // Đo bằng khoảng cách tới điểm bấm, KHÔNG dùng ev.movementX —
    // Safari trả 0 cho thuộc tính đó, làm mọi cú kéo bị coi là click.
    moved = Math.hypot(ev.clientX - pinDrag.ox, ev.clientY - pinDrag.oy);
    const r = viewport.getBoundingClientRect();
    const p = markers.find(m => m.id === pinDrag.id);
    if (!p) return;
    p.x = Math.min(1, Math.max(0, (ev.clientX - r.left - view.x) / view.s / imgW));
    p.y = Math.min(1, Math.max(0, (ev.clientY - r.top  - view.y) / view.s / imgH));
    pinDrag.el.style.left = (p.x * imgW) + 'px';
    pinDrag.el.style.top  = (p.y * imgH) + 'px';
    renderEdges();
    return;
  }

  if (!drag) return;
  moved = Math.hypot(ev.clientX - drag.ox, ev.clientY - drag.oy);
  view.x = drag.vx + (ev.clientX - drag.px);
  view.y = drag.vy + (ev.clientY - drag.py);
  clampView(); applyView();
});

function endPointer(ev){
  pointers.delete(ev.pointerId);
  if (pointers.size < 2) pinchStart = null;
  viewport.classList.remove('drag');

  if (pinDrag){
    if (moved > 4){ commitUndo(); persist(); renderEdges(); }
    else { dropUndo(); onPinClick(pinDrag.id); }
    pinDrag = null; return;
  }
  if (!drag) return;
  const wasClick = moved < 5;
  const { pin, edge } = drag;
  drag = null;
  if (!wasClick) return;

  if (edge && linking){
    const id = +edge.dataset.id;
    if (confirm('Xoá tuyến này?')){
      pushUndo('xoá tuyến');
      edges = edges.filter(e => e.id !== id);
      persistE(); refresh();
    }
    return;
  }
  if (pin){ onPinClick(+pin.dataset.id); return; }

  if (editing && !linking){
    const r = viewport.getBoundingClientRect();
    const x = (ev.clientX - r.left - view.x) / view.s / imgW;
    const y = (ev.clientY - r.top  - view.y) / view.s / imgH;
    if (x < 0 || x > 1 || y < 0 || y > 1) return;
    const cat = GAME.cats.find(c => !hidden.has(c.id)) || GAME.cats[0];
    pushUndo('thêm điểm');
    const p = { id:nextId++, map:curMap, cat:cat.id, name:'Điểm mới', x, y, note:'' };
    markers.push(p);
    persist(); refresh(); openDetail(p.id);
  } else if (!linking){
    closeDetail();
  }
}
viewport.addEventListener('pointerup', endPointer);
viewport.addEventListener('pointercancel', endPointer);

function onPinClick(id){
  if (linking){
    if (linkFrom === null){ linkFrom = id; renderPins(); return; }
    if (linkFrom === id){ linkFrom = null; renderPins(); return; }
    const type = $('#linkType').value;
    const dup = edges.find(e => e.map === curMap &&
      ((e.a === linkFrom && e.b === id) || (e.a === id && e.b === linkFrom)));
    pushUndo(dup ? 'đổi phương tiện của tuyến' : 'nối tuyến');
    if (dup){ dup.type = type; }
    else { edges.push({ id:nextEdge++, map:curMap, a:linkFrom, b:id, type }); }
    linkFrom = null;
    persistE(); refresh();
    return;
  }
  if (pickMode === 'A'){ routeA = id; pickMode = null; syncPickBtns(); refresh(); return; }
  if (pickMode === 'B'){ routeB = id; pickMode = null; syncPickBtns(); refresh(); return; }
  openDetail(id);
}

/* Zoom theo độ lớn cú lăn, không nhân cố định.
   Trackpad bắn hàng chục sự kiện mỗi giây nên nhân cố định sẽ bay vọt. */
viewport.addEventListener('wheel', ev => {
  ev.preventDefault();
  const Z = CONFIG.zoom;
  let d = ev.deltaY;
  if (ev.deltaMode === 1) d *= 16;        // đơn vị dòng  → px
  else if (ev.deltaMode === 2) d *= 400;  // đơn vị trang → px
  let mul = Math.exp(-d * Z.wheel);
  mul = Math.min(Z.maxPerEvent, Math.max(1 / Z.maxPerEvent, mul));
  zoomAt(ev.clientX, ev.clientY, mul);
}, { passive:false });

/* ================= tìm kiếm ================= */
const qEl = $('#q'), resEl = $('#results');
function runSearch(){
  const t = qEl.value.trim().toLowerCase();
  resEl.textContent = '';
  if (!t){ resEl.classList.remove('on'); return; }
  const hits = markers.filter(p =>
    p.name.toLowerCase().includes(t) || (p.note || '').toLowerCase().includes(t)
  ).slice(0, 40);
  if (!hits.length){
    resEl.innerHTML = '<div style="padding:11px 13px;color:var(--muted)">Không tìm thấy</div>';
    resEl.classList.add('on'); return;
  }
  for (const p of hits){
    const c = catById.get(p.cat) || { color:'#9ca3af', name:p.cat };
    const mp = GAME.maps.find(m => m.id === p.map);
    const b = document.createElement('button');
    b.innerHTML = '<span class="sw" style="background:' + c.color + '"></span><span></span><small>' +
                  esc(mp ? mp.name : p.map) + '</small>';
    b.querySelectorAll('span')[1].textContent = p.name;
    b.addEventListener('click', () => { goTo(p); resEl.classList.remove('on'); qEl.blur(); });
    resEl.appendChild(b);
  }
  resEl.classList.add('on');
}
function goTo(p){
  if (p.map !== curMap){ $('#mapSel').value = p.map; switchMap(p.map, true); }
  hidden.delete(p.cat); save(K.hidden, [...hidden]);
  const r = viewport.getBoundingClientRect();
  view.s = Math.max(view.s, 1.1);
  view.x = r.width/2  - p.x * imgW * view.s;
  view.y = r.height/2 - p.y * imgH * view.s;
  clampView(); applyView(); refresh(); openDetail(p.id);
}
qEl.addEventListener('input', runSearch);
qEl.addEventListener('focus', runSearch);
document.addEventListener('click', ev => {
  if (!ev.target.closest('#results') && ev.target !== qEl) resEl.classList.remove('on');
});

/* ================= bản đồ ================= */
async function switchMap(id, silent){
  curMap = id;
  const m = GAME.maps.find(x => x.id === id) || null;
  $('#mapName').textContent = m ? m.name : id;
  routeA = routeB = null; routePath = []; linkFrom = null;
  closeDetail();
  warn(null);

  img.onload = () => {
    imgW = img.naturalWidth; imgH = img.naturalHeight;
    img.style.display = 'block';
    fallback.style.display = 'none';
    if (!silent) fit(); else { clampView(); applyView(); }
    refresh();
    checkAspect(m);
  };
  img.onerror = () => {
    /* Ảnh hỏng / link chết / file không có: quay về màn chọn ảnh thay vì
       để màn hình trống không nói gì. */
    imgW = 2000; imgH = 2000;
    img.style.display = 'none';
    openImagePanel(m, false);
    if (!silent) fit();
    refresh();
  };

  /* Thứ tự: ảnh người dùng tự chọn → ảnh mặc định trên mạng (nếu họ đã
     bấm dùng) → file trong maps/. Ảnh người dùng chọn đứng trước vì đó
     là việc họ chủ động làm gần nhất. */
  const pref = m ? imgPref()[m.id] : null;
  if (m && pref === 'custom'){
    let blob = sessionImages.get(imgKey(m.id));
    if (!blob) blob = await IDB.get(imgKey(m.id)).catch(() => null);
    if (blob){ showImage(URL.createObjectURL(blob), true); return; }
    setImgPref(m.id, null);          // ảnh biến mất thì đừng nhớ nữa
  }
  if (m && pref === 'remote' && m.remote){ showImage(m.remote.url); return; }
  if (m && m.src){ showImage(m.src); return; }

  imgW = 2000; imgH = 2000;
  img.style.display = 'none';
  openImagePanel(m, false);
  if (!silent) fit();
  refresh();
}

/* ================= kiểm tỉ lệ khung hình ================= */
/* Toạ độ marker lưu theo tỉ lệ 0–1 của ảnh, nên đổi ĐỘ PHÂN GIẢI thì
   không sao — 1400×1400 hay 2800×2800 đều đúng chỗ. Nhưng đổi TỈ LỆ
   KHUNG HÌNH thì lệch sạch: ảnh 3:2 nạp vào bộ dữ liệu đặt theo ảnh 1:1
   sẽ kéo giãn một chiều, và người dùng chỉ thấy "marker sai hết" mà
   không biết vì sao. Nên nói thẳng ra ngay lúc nạp ảnh.

   Ngưỡng 2%: ảnh cắt xén lặt vặt vài pixel thì bỏ qua, đừng làm phiền. */
const ASPECT_TOLERANCE = 0.02;

function checkAspect(m){
  if (!m || !m.aspect || !imgW || !imgH) return warn(null);
  const got  = imgW / imgH;
  const want = m.aspect;
  const off  = Math.abs(got - want) / want;
  if (off <= ASPECT_TOLERANCE) return warn(null);

  const fmt = r => (r >= 1 ? (r.toFixed(2) + ' : 1') : ('1 : ' + (1/r).toFixed(2)));
  warn('Ảnh này tỉ lệ <b>' + fmt(got) + '</b> (' + imgW + '×' + imgH + '), ' +
       'còn dữ liệu <b>' + esc(GAME.name) + '</b> được đặt theo ảnh tỉ lệ <b>' + fmt(want) + '</b> — ' +
       'lệch <b>' + Math.round(off * 100) + '%</b>, nên <b>marker sẽ nằm sai chỗ</b>.<br>' +
       'Dùng ảnh đúng tỉ lệ thì khớp ngay; hoặc cứ dùng ảnh này rồi vào ' +
       '<b>✎ Biên tập</b> kéo chỉnh lại điểm.');
}

function warn(html){
  const bar = $('#warnbar');
  if (!html){ bar.classList.remove('on'); return; }
  $('#warnTxt').innerHTML = html;
  bar.classList.add('on');
}
$('#warnClose').addEventListener('click', () => warn(null));
$('#warnFix').addEventListener('click', () => { warn(null); openImagePanel(null, true); });

/* ================= chọn ảnh bản đồ ================= */
/* closable = mở từ nút "🖼 Ảnh bản đồ" khi đang có ảnh sẵn, nên cho đóng
   lại. Còn khi không có ảnh nào thì không có gì để quay về. */
function openImagePanel(m, closable){
  const map = m || GAME.maps.find(x => x.id === curMap) || null;
  const R   = map && map.remote;
  $('#fbTitle').textContent = closable ? 'Ảnh bản đồ' : 'Chưa có ảnh bản đồ';
  $('#fbText').innerHTML = map && map.src

/* Nhận ảnh người dùng chọn: dùng ngay, rồi mới cố lưu. Lưu được hay
   không cũng không cản họ xem bản đồ trong phiên này. */
async function useImageBlob(blob){
  const map = GAME.maps.find(x => x.id === curMap);
  if (!map) return;
  const key = imgKey(map.id);
  sessionImages.set(key, blob);
  setImgPref(map.id, 'custom');
  showImage(URL.createObjectURL(blob), true);

  try {
    await IDB.put(key, blob);
  } catch(err){
    /* Safari trên file:// rơi vào đây. Nói thẳng, đừng để người dùng
       tưởng đã lưu rồi mai mở lên thấy trống. */
    console.warn('[bản đồ] không lưu được ảnh vào IndexedDB:', err.message);
    note('⚠️ Trình duyệt không cho lưu ảnh (hay gặp khi mở bằng <code>file://</code> trên Safari). ' +
         'Ảnh dùng được cho lần mở này, nhưng <b>lần sau bạn phải chọn lại</b>.<br>' +
         'Muốn khỏi chọn lại: đặt ảnh vào <code>' + esc(map.src || 'maps/') + '</code>.', 'warn');
    fallback.style.display = 'grid';
    setTimeout(() => { if (img.complete && img.naturalWidth) fallback.style.display = 'none'; }, 6000);
  }
}

/* Nối tự động: tạo tuyến ĐI BỘ giữa mọi cặp điểm gần nhau hơn bán kính
   cho trước. Máy không biết đâu là biển, nên nó sẽ nối lố vài chỗ —
   nhanh hơn nhiều so với vẽ tay, rồi xoá vài đường sai là xong. */
function autoConnect(pctIn){
  const pct = Math.min(60, Math.max(2, pctIn || +$('#autoR').value || 12));
  const R = pct / 100 * Math.max(imgW, imgH);
  const pts = markers.filter(p => p.map === curMap);
  const has = new Set(edges.filter(e => e.map === curMap)
                           .map(e => Math.min(e.a,e.b) + ':' + Math.max(e.a,e.b)));
  const add = [];
  let skipped = 0;
  for (let i = 0; i < pts.length; i++){
    for (let j = i+1; j < pts.length; j++){
      const k = Math.min(pts[i].id,pts[j].id) + ':' + Math.max(pts[i].id,pts[j].id);
      if (has.has(k)) continue;
      if (dist(pts[i], pts[j]) > R) continue;
      /* Gần nhau trên ảnh không có nghĩa là đi bộ sang nhau được: hai bờ
         một eo biển thì sát nhau mà phải có tàu. Đếm sau khi đã lọc bán
         kính, để con số báo ra là số cặp THẬT SỰ bị bỏ, không phải mọi
         cặp khác khối đất trên bản đồ. */
      if (!sameLand(pts[i], pts[j])) { skipped++; continue; }
      add.push([pts[i].id, pts[j].id]);
    }
  }
  const note = skipped
    ? '\n\nĐã bỏ qua ' + skipped + ' cặp nằm trên hai khối đất khác nhau — chỗ đó phải đi tàu hoặc phi thuyền.'
    : '';
  if (!add.length){ alert('Không có cặp điểm nào trong bán kính ' + pct + '%.' + note); return; }
  if (!confirm('Tạo ' + add.length + ' tuyến đi bộ giữa các điểm cách nhau dưới ' + pct + '% chiều rộng bản đồ?' + note +
               '\n\nĐường vẽ là đường thẳng, nên vài tuyến sẽ cắt ngang vịnh dù hai đầu vẫn cùng một khối đất. ' +
               'Bấm lên tuyến để xoá.')) return;
  pushUndo('nối gần (' + add.length + ' tuyến)');
  const walk = (GAME.rules || {}).walkLink || GAME.links[0].id;
  for (const [a,b] of add) edges.push({ id:nextEdge++, map:curMap, a, b, type:walk });
  persistE(); refresh();
}
$('#autoBtn').addEventListener('click', () => autoConnect());

/* Dọn những tuyến ĐI BỘ nối hai khối đất khác nhau — thứ mà "⚡ Nối gần"
   của bản cũ đẻ ra khi nó còn chưa biết đâu là biển. Chỉ đụng tuyến đi bộ:
   tuyến tàu và phi thuyền vượt biển là chuyện bình thường, và tuyến người
   dùng tự nối tay thì họ có lý do của họ. */
function cleanCrossLand(){
  const walk  = (GAME.rules || {}).walkLink;
  const byId  = new Map(markers.map(p => [p.id, p]));
  const bad = edges.filter(e => {
    if (e.map !== curMap) return false;
    if (walk && e.type !== walk) return false;
    const A = byId.get(e.a), B = byId.get(e.b);
    return A && B && A.land && B.land && A.land !== B.land;
  });
  if (!bad.length){
    alert('Không có tuyến đi bộ nào nối hai khối đất khác nhau.\n\n' +
          'Lưu ý: tuyến cắt ngang vịnh mà hai đầu vẫn cùng một khối đất thì ' +
          'đi bộ được (vòng quanh vịnh), chỉ là đường vẽ thẳng nên trông lạ.');
    return;
  }
  const list = bad.slice(0, 12).map(e =>
    '· ' + byId.get(e.a).name + ' ↔ ' + byId.get(e.b).name).join('\n');
  if (!confirm('Tìm thấy ' + bad.length + ' tuyến đi bộ băng qua biển:\n\n' + list +
               (bad.length > 12 ? '\n· … và ' + (bad.length - 12) + ' tuyến nữa' : '') +
               '\n\nXoá hết? (hoàn tác được bằng ↶)')) return;
  pushUndo('dọn ' + bad.length + ' tuyến lố');
  const ids = new Set(bad.map(e => e.id));
  edges = edges.filter(e => !ids.has(e.id));
  persistE(); refresh();
  alert('Đã xoá ' + bad.length + ' tuyến.');
}
$('#cleanBtn').addEventListener('click', cleanCrossLand);

/* Nối đầy đủ các điểm thuộc nhóm "đầu mối" với nhau, cộng thêm vài
   tuyến đặc biệt. LUẬT NẰM Ở BỘ DỮ LIỆU GAME (GAME.rules), engine
   không biết 'port' hay 'boat' là gì — trước đây mấy chuỗi đó nằm
   thẳng trong hàm này nên game khác nạp vào là sai ngay. */
function portConnect(){
  const R = GAME.rules || {};
  if (!R.hubCat || !R.hubLink){
    alert('Bộ dữ liệu "' + GAME.name + '" không khai luật nối đầu mối.');
    return;
  }
  const hubName = (catById.get(R.hubCat) || {}).name || R.hubCat;
  let ports = markers.filter(p => p.map === curMap && p.cat === R.hubCat);

  if (ports.length < 2){
    const seedable = (R.hubSeed || []).length;
    if (!seedable){
      alert('Bản đồ chưa có đủ 2 điểm thuộc nhóm "' + hubName + '" để nối.');
      return;
    }
    if (!confirm('Chưa đủ điểm thuộc nhóm "' + hubName + '".\n\nTạo sẵn ' + seedable +
                 ' điểm (vị trí ước lượng, kéo chỉnh sau) rồi nối với nhau?')) return;
    pushUndo('tạo điểm "' + hubName + '"');
    for (const d of R.hubSeed){
      if (markers.some(p => p.map === curMap && p.name === d.name)) continue;
      markers.push({ id:nextId++, map:curMap, cat:R.hubCat, name:d.name, x:d.x, y:d.y,
                     note:'Vị trí ước lượng, kéo chỉnh' });
    }
    for (const nm of (R.hubPromote || [])){
      const h = markers.find(p => p.map === curMap && p.name === nm);
      if (h) h.cat = R.hubCat;
    }
    persist();
    ports = markers.filter(p => p.map === curMap && p.cat === R.hubCat);
  }

  const key = (a,b) => Math.min(a,b) + ':' + Math.max(a,b);
  const has = new Set(edges.filter(e => e.map === curMap).map(e => key(e.a, e.b)));
  const before = takeSnapshot('nối các điểm "' + hubName + '"');
  let n = 0;
  const addEdge = (a, b, type) => {
    if (has.has(key(a,b))) return;
    edges.push({ id:nextEdge++, map:curMap, a, b, type });
    has.add(key(a,b)); n++;
  };

  for (let i = 0; i < ports.length; i++)
    for (let j = i+1; j < ports.length; j++)
      addEdge(ports[i].id, ports[j].id, R.hubLink);

  /* Tuyến đặc biệt khai theo TÊN điểm trong bộ dữ liệu game. */
  for (const x of (R.extraEdges || [])){
    const A = markers.find(p => p.map === curMap && p.name === x.from);
    const B = markers.find(p => p.map === curMap && p.name === x.to);
    if (A && B) addEdge(A.id, B.id, x.type || R.hubLink);
  }

  /* Chỉ ghi một bước hoàn tác khi thật sự có thêm tuyến. */
  if (n){ undoStack.push(before); while (undoStack.length > undoCap()) undoStack.shift(); syncUndo(); }
  persistE(); refresh();
  alert(n ? 'Đã thêm ' + n + ' tuyến nối các điểm nhóm "' + hubName + '".'
          : 'Các điểm nhóm "' + hubName + '" đã nối đủ với nhau rồi.');
}

/* Thẻ <script> chèn động, KHÔNG fetch() và KHÔNG import: mở trang bằng
   file:// thì hai cách kia bị CORS chặn, còn thẻ script thì không.
   [ĐO 2026-09-20, Chromium, file://] nạp OK, và file thiếu có bắn
   onerror — nên bắt được lỗi thay vì treo im lặng. */
function loadScript(src){
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src;
    s.async = false;                       // giữ đúng thứ tự khai báo
    s.onload  = () => res();
    s.onerror = () => rej(new Error('Không nạp được ' + src));
    document.head.appendChild(s);
  });
}

function fatal(msg){

/* Chuyển dữ liệu của bản cũ (một game, khoá 'ff9map.v1.*') sang khoá mới
   theo game. Chạy đúng MỘT lần cho mỗi game, đánh dấu bằng cờ .migrated —
   không có cờ này thì người dùng xoá hết marker xong mở lại sẽ bị kéo
   nguyên dữ liệu cũ về, tưởng app tự hồi sinh thứ mình vừa xoá.

   KHÔNG xoá khoá cũ: nếu chuyển sai thì dữ liệu gốc vẫn còn đó mà lấy lại. */
function migrateLegacy(g, base){
  const legacy = g.legacyStore;
  if (!legacy) return;
  const flag = base + 'migrated';
  try {
    if (localStorage.getItem(flag)) return;
    const moved = [];
    for (const name of ['data', 'edges', 'found', 'hidden']){
      const old = localStorage.getItem(legacy + '.' + name);
      if (old !== null && localStorage.getItem(base + name) === null){
        localStorage.setItem(base + name, old);
        moved.push(name);
      }
    }
    const oldTheme = localStorage.getItem(legacy + '.theme');
    if (oldTheme !== null && localStorage.getItem(K_THEME) === null){
      localStorage.setItem(K_THEME, oldTheme);
      moved.push('theme');
    }
    localStorage.setItem(flag, new Date().toISOString());
    if (moved.length)
      console.info('[bản đồ] đã chuyển dữ liệu cũ "' + legacy + '.*" sang "' + base +
                   '*": ' + moved.join(', ') + '. Khoá cũ vẫn giữ nguyên.');
  } catch { /* chế độ riêng tư: không lưu được thì cũng không migrate được */ }
}

/* Gắn một bộ dữ liệu game vào engine. Mọi thứ phụ thuộc game đều được
   tính lại ở đây — engine không giữ hằng số nào của riêng game nào. */
function applyGame(g){
  GAME     = g;
  catById  = new Map(g.cats.map(c => [c.id, c]));
  linkById = new Map(g.links.map(c => [c.id, c]));
  const base = NS + g.id + '.';
  K = {
    data:   base + 'data',
    edges:  base + 'edges',
    found:  base + 'found',
    hidden: base + 'hidden',
    imgPref:base + 'imgpref',
    theme:  K_THEME,
  };
  migrateLegacy(g, base);
  curMap = g.maps[0].id;
  warnedScale = false;

  document.title = 'Bản đồ tương tác — ' + g.name;
  $('#gameSel').value = g.id;
  $('#mapSel').innerHTML   = g.maps.map(m =>
    '<option value="' + m.id + '">' + esc(m.name) + '</option>').join('');
  $('#linkType').innerHTML = g.links.map(t =>
    '<option value="' + t.id + '">' + esc(t.name) + '</option>').join('');

  /* Cờ tính năng: ẩn HẲN khối, không phải làm mờ. Game open world đặt
     routing:false vì đi đâu cũng được — để lại một khung Chỉ đường bấm
     không ăn thua thì tệ hơn là không có. */
  const show = (sel, on) => { const el = $(sel); if (el) el.style.display = on ? '' : 'none'; };
  show('#routeSec', feat('routing'));
  show('#linkGrp',  feat('routing'));
  show('#hubGrp',   feat('routing') && !!(g.rules || {}).hubCat);
  show('#autoGrp',  feat('routing'));
  show('#progSec',  feat('progress'));
  show('#resetBtn', feat('progress'));
}

/* ================= chọn game ================= */
let GAMELIST = [];
const loadedGames = new Map();          // id -> bộ dữ liệu đã nạp

/* Nạp file dữ liệu của một game rồi gắn vào engine. Chỉ nạp file của
   game đang xem — nạp sẵn cả mười game là tốn công khi mỗi lúc người
   dùng chỉ nhìn một cái. Đã nạp rồi thì dùng lại, không nạp hai lần. */
async function selectGame(id){
  const entry = GAMELIST.find(x => x.id === id);
  if (!entry){ fatal('Không có game id "' + id + '" trong ' + CONFIG.gameList); return; }

  let g = loadedGames.get(id);
  if (!g){
    try { await loadScript(entry.file); }
    catch(err){ fatal(err.message); return; }
    g = (window.MAPGAMES || []).find(x => x.id === id);
    if (!g){
      fatal(entry.file + ' nạp được nhưng không đăng ký game id "' + id + '".');
      return;
    }
    loadedGames.set(id, g);
  }

  /* Trạng thái của game cũ phải dọn sạch: id marker của game này trùng
     id của game kia, để sót là tuyến trỏ lung tung. */
  routeA = routeB = null; routePath = []; pickMode = null; linkFrom = null;
  /* id marker của game này trùng id của game kia, nên bản chụp cũ mà đem
     áp vào game mới là trộn dữ liệu hai game. Bỏ hết. */
  undoStack = []; pendingUndo = null;

  applyGame(g);
  boot();                 // đọc lại localStorage theo khoá của game mới
  /* setEdit() phải chạy SAU applyGame: nó gọi refresh(), mà refresh đọc
     GAME.cats — gọi sớm là vỡ ngay lần mở đầu tiên khi GAME còn null. */
  setEdit(false);
  syncPickBtns();
  switchMap(curMap);
  save(K_GAME, id);
}

$('#gameSel').addEventListener('change', e => selectGame(e.target.value));

/* ================= khởi động ================= */
(async () => {
  try { await loadScript(CONFIG.gameList); }
  catch(err){ fatal(err.message); return; }

  GAMELIST = window.MAPGAMELIST || [];
  if (!GAMELIST.length){
    fatal(CONFIG.gameList + ' nạp được nhưng không khai game nào trong window.MAPGAMELIST.');
    return;
  }

  $('#gameSel').innerHTML = GAMELIST.map(x =>
    '<option value="' + x.id + '">' + esc(x.name) + '</option>').join('');
  /* Một game thì bộ chọn chẳng để làm gì, nhưng vẫn hiện — nó là chỗ
     người dùng nhìn vào để biết app xem được nhiều game. */
  $('#gameSec').title = GAMELIST.map(x => x.name + (x.note ? ' — ' + x.note : '')).join('\n');

  const want = load(K_GAME, null);
  const pick = GAMELIST.some(x => x.id === want) ? want : GAMELIST[0].id;
  await selectGame(pick);
})();
})();
</script>
